<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b2230" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Before: the whole answer goes back into the history, the model copies its old evidence and greedy decoding repeats the same answer. After: only the SAY line goes back, and the prompt adds a current scene image, so evidence comes from the image."><rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2230"/></marker>
        <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
        <marker id="b3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2456c9"/></marker>
      </defs>
      <text x="20" y="26" font-size="16" font-weight="600" fill="#1b2230">Friday: whole answer in the history</text>
      <rect fill="#ffffff" stroke="#1b2230" stroke-width="1.3" x="20" y="50" width="190" height="62" rx="8"/>
      <text x="115" y="77" text-anchor="middle">History</text>
      <text x="115" y="97" text-anchor="middle" font-size="11.5" fill="#5b6577">7 lines per answer</text>
      <rect fill="#ffffff" stroke="#1b2230" stroke-width="1.3" x="280" y="50" width="190" height="62" rx="8"/>
      <text x="375" y="77" text-anchor="middle">Prompt</text>
      <text x="375" y="97" text-anchor="middle" font-size="11.5" fill="#5b6577">history + 10 s clip</text>
      <rect fill="#ffffff" stroke="#1b2230" stroke-width="1.3" x="280" y="190" width="190" height="62" rx="8"/>
      <text x="375" y="217" text-anchor="middle">Qwen</text>
      <text x="375" y="237" text-anchor="middle" font-size="11.5" fill="#5b6577">greedy: same in, same out</text>
      <rect fill="#fbe9e7" stroke="#b3261e" stroke-width="2" x="20" y="190" width="190" height="62" rx="8"/>
      <text x="115" y="217" text-anchor="middle" fill="#b3261e" font-weight="600">Answer</text>
      <text x="115" y="237" text-anchor="middle" font-size="11.5" fill="#5b6577">EVIDENCE copied from text</text>
      <line stroke="#1b2230" stroke-width="1.4" fill="none" x1="210" y1="81" x2="278" y2="81" marker-end="url(#b1)"/>
      <line stroke="#1b2230" stroke-width="1.4" fill="none" x1="375" y1="112" x2="375" y2="188" marker-end="url(#b1)"/>
      <line stroke="#1b2230" stroke-width="1.4" fill="none" x1="280" y1="221" x2="212" y2="221" marker-end="url(#b1)"/>
      <line stroke="#b3261e" stroke-width="2.4" fill="none" x1="115" y1="190" x2="115" y2="114" marker-end="url(#b2)"/>
      <text x="124" y="148" fill="#b3261e" font-weight="600">whole answer</text>
      <text x="124" y="164" font-size="11.5" fill="#5b6577">incl. old EVIDENCE</text>
      <text x="20" y="285" font-size="11.5" fill="#5b6577">Each turn's input nearly equals the last, so the output is identical.</text>

      <line x1="500" y1="20" x2="500" y2="285" stroke="#d9dee7" stroke-width="1.5"/>

      <text x="530" y="26" font-size="16" font-weight="600" fill="#2456c9">Fix: SAY only, plus the current scene</text>
      <rect fill="#ffffff" stroke="#1b2230" stroke-width="1.3" x="530" y="50" width="190" height="62" rx="8"/>
      <text x="625" y="77" text-anchor="middle">History</text>
      <text x="625" y="97" text-anchor="middle" font-size="11.5" fill="#5b6577">spoken lines only</text>
      <rect fill="#e6edfb" stroke="#2456c9" stroke-width="2" x="790" y="50" width="190" height="62" rx="8"/>
      <text x="885" y="77" text-anchor="middle" fill="#2456c9" font-weight="600">Prompt</text>
      <text x="885" y="97" text-anchor="middle" font-size="11.5" fill="#5b6577">+ current scene image</text>
      <rect fill="#ffffff" stroke="#1b2230" stroke-width="1.3" x="790" y="190" width="190" height="62" rx="8"/>
      <text x="885" y="217" text-anchor="middle">Qwen</text>
      <text x="885" y="237" text-anchor="middle" font-size="11.5" fill="#5b6577">greedy</text>
      <rect fill="#ffffff" stroke="#1b2230" stroke-width="1.3" x="530" y="190" width="190" height="62" rx="8"/>
      <text x="625" y="217" text-anchor="middle">Answer</text>
      <text x="625" y="237" text-anchor="middle" font-size="11.5" fill="#5b6577">EVIDENCE from the image</text>
      <line stroke="#1b2230" stroke-width="1.4" fill="none" x1="720" y1="81" x2="788" y2="81" marker-end="url(#b1)"/>
      <line stroke="#1b2230" stroke-width="1.4" fill="none" x1="885" y1="112" x2="885" y2="188" marker-end="url(#b1)"/>
      <line stroke="#1b2230" stroke-width="1.4" fill="none" x1="790" y1="221" x2="722" y2="221" marker-end="url(#b1)"/>
      <line stroke="#2456c9" stroke-width="2.4" fill="none" x1="625" y1="190" x2="625" y2="114" marker-end="url(#b3)"/>
      <text x="634" y="148" fill="#2456c9" font-weight="600">SAY line only</text>
      <text x="634" y="164" font-size="11.5" fill="#5b6577">no old EVIDENCE to copy</text>
      <text x="530" y="285" font-size="11.5" fill="#5b6577">The copy source is gone; the scene image is the only place left to read from.</text>
    </svg>