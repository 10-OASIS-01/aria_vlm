<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1b2230" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="The glasses stream to aria_node, guidance_node sends goal, history and 20 frames to the backend, Qwen answers in seven lines, guidance_node speaks the SAY line and appends the answer to the history, which goes out with the next plan."><rect width="100%" height="100%" fill="#ffffff"/>
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2230"/></marker>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2456c9"/></marker>
      </defs>
      <rect fill="#ffffff" stroke="#1b2230" stroke-width="1.3" x="20" y="40" width="150" height="76" rx="8"/>
      <text x="95" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2230">Glasses</text>
      <text x="95" y="94" text-anchor="middle" font-size="11.5" fill="#5b6577">camera · mic · speaker</text>

      <rect fill="#ffffff" stroke="#1b2230" stroke-width="1.3" x="230" y="40" width="150" height="76" rx="8"/>
      <text x="305" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2230">aria_node</text>
      <text x="305" y="94" text-anchor="middle" font-size="11.5" fill="#5b6577">ROS topics</text>

      <rect fill="#ffffff" stroke="#1b2230" stroke-width="1.3" x="440" y="40" width="210" height="76" rx="8"/>
      <text x="545" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2230">guidance_node</text>
      <text x="545" y="94" text-anchor="middle" font-size="11.5" fill="#5b6577">Task: goal · state · history</text>

      <rect fill="#ffffff" stroke="#1b2230" stroke-width="1.3" x="760" y="40" width="220" height="76" rx="8"/>
      <text x="870" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2230">Backend · Qwen3.5-9B</text>
      <text x="870" y="94" text-anchor="middle" font-size="11.5" fill="#5b6577">POST /v1/plan · greedy</text>

      <line stroke="#1b2230" stroke-width="1.4" fill="none" x1="170" y1="78" x2="228" y2="78" marker-end="url(#a)"/>
      <text x="199" y="68" text-anchor="middle" font-size="11.5" fill="#5b6577">5 Hz</text>
      <line stroke="#1b2230" stroke-width="1.4" fill="none" x1="380" y1="78" x2="438" y2="78" marker-end="url(#a)"/>
      <text x="409" y="68" text-anchor="middle" font-size="11.5" fill="#5b6577">frames</text>

      <line stroke="#1b2230" stroke-width="1.4" fill="none" x1="650" y1="62" x2="758" y2="62" marker-end="url(#a)"/>
      <text x="704" y="53" text-anchor="middle" font-size="11.5" fill="#5b6577">goal + history + 20 frames</text>
      <line stroke="#1b2230" stroke-width="1.4" fill="none" x1="758" y1="100" x2="652" y2="100" marker-end="url(#a)"/>
      <text x="704" y="118" text-anchor="middle" font-size="11.5" fill="#5b6577">7 lines: CHECK … PLAN</text>

      <rect fill="#e6edfb" stroke="#2456c9" stroke-width="2" x="440" y="196" width="210" height="64" rx="8"/>
      <text x="545" y="224" text-anchor="middle" font-size="16" font-weight="600" fill="#2456c9">history</text>
      <text x="545" y="245" text-anchor="middle" font-size="11.5" fill="#5b6577">last 24 turns, model reads 12</text>

      <line stroke="#2456c9" stroke-width="2.4" fill="none" x1="510" y1="118" x2="510" y2="194" marker-end="url(#ah)"/>
      <text x="520" y="152" fill="#2456c9" font-weight="600">append answer</text>
      <text x="520" y="168" font-size="11.5" fill="#5b6577">the line this fix changes</text>
      <path stroke="#1b2230" stroke-width="1.4" fill="none" d="M650 228 H 705 V 66" stroke-dasharray="4 4" marker-end="url(#a)"/>
      <text x="714" y="190" font-size="11.5" fill="#5b6577">sent with the</text>
      <text x="714" y="205" font-size="11.5" fill="#5b6577">next plan</text>

      <path stroke="#1b2230" stroke-width="1.4" fill="none" d="M470 118 V 160 H 95 V 118" marker-end="url(#a)"/>
      <text x="282" y="152" text-anchor="middle" font-size="11.5" fill="#5b6577">SAY line → /aria/tts → speaker</text>
      <path stroke="#1b2230" stroke-width="1.4" fill="none" d="M60 116 V 290 H 440 V 262" marker-end="url(#a)"/>
      <text x="250" y="282" text-anchor="middle" font-size="11.5" fill="#5b6577">person replies "Done." → speech recognition → appended as a user turn</text>
    </svg>