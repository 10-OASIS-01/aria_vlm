[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-guidance"
version = "0.1.0"
description = "Qwen visual task guidance for Project Aria Gen2 and aria2_ros2"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "Pillow>=10.4,<13",
  "numpy>=1.26,<3",
  "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
model = ["torch>=2.6,<3", "torchvision>=0.21,<1", "transformers==5.3.0", "accelerate>=1.10,<2"]
speech = ["faster-whisper>=1.2,<2"]

[project.scripts]
aria-guidance = "aria_guidance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aria_guidance = ["web/*"]

[tool.ruff]
line-length = 100
